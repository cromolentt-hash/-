:root{
  --bg: #FCDFE4;
  --card-bg: #FFFFFF;
  --card-result-bg: #6B1F30;
  --pink: #F5B1C8;
  --pink-soft: #FBE2E8;
  --peach: #FDD9CB;
  --beige: #FCE1C4;
  --gold: #E5AD18;
  --gold-deep: #B8850A;
  --ink: #2B2320;
  --ink-muted: #8A736C;
  --cream: #FFF8F3;
  --line: rgba(43,35,32,0.10);
  --line-result: rgba(255,248,243,0.22);

  --font-display: 'AGOptCyrillic', 'Times New Roman', serif;
  --font-script: 'Gogol', cursive;
  --font-body: 'AGOptCyrillic', sans-serif;
  --font-utility: 'AGOptCyrillic', sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 48px 16px 64px;
}

/* ---------------- decorative brand background ---------------- */
.deco{
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.9;
}
.deco-loop{ top: -60px; left: 50%; transform: translateX(-50%); width: 720px; max-width: 130vw; opacity:0.55; }
.deco-cloud-1{ top: 6%; left: -40px; width: 170px; opacity:0.8; }
.deco-cloud-2{ bottom: 4%; right: -30px; width: 210px; opacity:0.75; }
.deco-heart-1{ top: 14%; right: 6%; width: 26px; opacity:0.8; }
.deco-heart-2{ bottom: 10%; left: 8%; width: 18px; opacity:0.7; }

@media (max-width: 640px){
  .deco-cloud-1, .deco-cloud-2{ width: 110px; }
  .deco-loop{ width: 480px; }
}

/* ---------------- shell ---------------- */
.app{
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
}

.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 8px;
  margin-bottom: 22px;
  text-align:center;
}

.logo-img{
  width: 240px;
  max-width: 60vw;
  height: auto;
  display:block;
}

.tagline{
  font-family: var(--font-utility);
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* progress squiggle (brand curl motif) */
.progress-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin: 18px 0 26px;
}
#curl-base{ fill:none; stroke: rgba(43,35,32,0.14); stroke-width:3; stroke-linecap:round; }
#curl-fill{ fill:none; stroke: var(--gold); stroke-width:3; stroke-linecap:round; transition: stroke-dashoffset 0.6s cubic-bezier(.65,0,.35,1); }
.progress-label{
  font-family: var(--font-utility);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* ---------------- card ---------------- */
.card{
  background: var(--card-bg);
  border-radius: 26px;
  padding: 42px 34px;
  box-shadow: 0 40px 70px -36px rgba(107,31,48,0.35);
  transition: background 0.3s ease;
}
.card.result-mode{
  background: var(--card-result-bg);
  color: var(--cream);
}

@media (max-width: 480px){
  .card{ padding: 30px 22px; }
  .logo{ font-size: 34px; }
}

h1{
  font-family: var(--font-display);
  font-weight:400;
  font-size: 32px;
  line-height:1.2;
  margin-bottom: 14px;
  color: var(--ink);
}

h2{
  font-family: var(--font-body);
  font-weight:600;
  font-size: 21px;
  line-height:1.4;
  margin-bottom: 22px;
  color: var(--ink);
}

p.lede{
  color: var(--ink-muted);
  font-size: 15px;
  line-height:1.65;
  margin-bottom: 26px;
}

p.slogan{
  font-family: var(--font-script);
  font-size: 26px;
  color: var(--pink);
  text-align:center;
  margin-top: 26px;
  line-height:1.3;
}

.qnum{
  font-family: var(--font-utility);
  font-size: 12px;
  letter-spacing:0.1em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 10px;
}

.options{
  display:flex;
  flex-direction:column;
  gap: 10px;
  margin-bottom: 8px;
}

.option{
  text-align:left;
  background: var(--pink-soft);
  border: 1px solid transparent;
  color: var(--ink);
  border-radius: 14px;
  padding: 15px 18px;
  font-family: var(--font-body);
  font-size: 15px;
  cursor:pointer;
  transition: all 0.15s ease;
}
.option:hover{
  background: var(--pink);
  transform: translateX(2px);
}
.option:active{ transform: translateX(0) scale(0.99); }

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background: var(--gold);
  color: #2B2000;
  border:none;
  border-radius: 999px;
  padding: 14px 28px;
  font-family: var(--font-body);
  font-weight:600;
  font-size: 15px;
  cursor:pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.btn:hover{ filter: brightness(1.07); transform: translateY(-1px); }

.btn-ghost{
  background: transparent;
  color: var(--cream);
  border: 1px solid var(--line-result);
}
.btn-ghost:hover{ background: rgba(255,248,243,0.08); }

.footer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top: 22px;
}

.back-link{
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-muted);
  background:none;
  border:none;
  cursor:pointer;
}
.back-link:hover{ color: var(--ink); }

/* ---------------- result screen ---------------- */
.type-badge{
  display:inline-block;
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 999px;
  padding: 6px 18px;
  margin-bottom: 18px;
}

.damage-badge{
  display:inline-block;
  font-family: var(--font-utility);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--cream);
  background: rgba(255,248,243,0.12);
  border-radius: 999px;
  padding: 6px 16px;
  margin-bottom: 18px;
  margin-left: 8px;
}
.damage-badge.dmg-0{ background: rgba(200,230,190,0.22); }
.damage-badge.dmg-1{ background: rgba(252,225,196,0.22); }
.damage-badge.dmg-2{ background: rgba(253,217,203,0.28); }
.damage-badge.dmg-3{ background: rgba(240,140,140,0.28); }

.result-title{
  font-family: var(--font-display);
  font-weight:400;
  font-size: 34px;
  line-height:1.2;
  margin-bottom: 14px;
  color: var(--cream);
}

.result-desc{
  color: rgba(255,248,243,0.82);
  font-size: 15px;
  line-height:1.65;
  margin-bottom: 22px;
}

.transitional-note{
  font-size: 13.5px;
  color: var(--cream);
  background: rgba(255,248,243,0.1);
  border: 1px solid var(--line-result);
  border-radius: 12px;
  padding: 13px 15px;
  margin-bottom: 22px;
  line-height: 1.5;
}

.tips{
  display:flex;
  flex-direction:column;
  gap: 12px;
  margin-bottom: 30px;
}

.tip{
  border-radius: 14px;
  padding: 15px 17px;
  color: var(--ink);
}
.tip.tip-peach{ background: var(--peach); }
.tip.tip-beige{ background: var(--beige); }
.tip.tip-pink{ background: var(--pink-soft); }
.tip.tip-blue{ background: #E0F2FE; }

.tip-label{
  font-family: var(--font-utility);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 6px;
  display:block;
}

.tip-text{
  font-size: 14px;
  line-height: 1.55;
}

.products{
  display:flex;
  flex-direction:column;
  gap: 10px;
  margin-bottom: 26px;
}

.product-card{
  display:flex;
  gap: 14px;
  align-items:center;
  background: rgba(255,248,243,0.08);
  border: 1px solid var(--line-result);
  border-radius: 16px;
  padding: 14px;
  text-decoration:none;
  transition: background 0.15s ease, transform 0.15s ease;
}
.product-card:hover{ background: rgba(255,248,243,0.14); transform: translateY(-1px); }

.product-img-link{ flex-shrink:0; display:block; }
.product-img{
  width: 78px;
  height: 78px;
  object-fit: cover;
  border-radius: 12px;
  background: #fff;
  display:block;
}

.product-info{
  display:flex;
  flex-direction:column;
  gap: 4px;
  min-width:0;
}

.product-eyebrow{
  font-family: var(--font-utility);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
}

.product-name{
  font-family: var(--font-body);
  font-weight:600;
  font-size: 14.5px;
  color: var(--cream);
  line-height:1.3;
}

.product-price{
  font-family: var(--font-utility);
  font-size: 13px;
  color: rgba(255,248,243,0.75);
}

.product-cta{
  font-family: var(--font-body);
  font-weight:600;
  font-size: 13px;
  color: var(--gold);
}

.hidden{ display:none !important; }
</style>

/* ---------------- quiz data ---------------- */

  document.getElementById('qtext').textContent = q.text;
  const wrap = document.getElementById('qoptions');
  wrap.innerHTML = '';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.label;
    btn.onclick = ()=>selectOption(opt);
    wrap.appendChild(btn);
  });
  document.getElementById('back-btn').style.visibility = currentIndex===0 ? 'hidden' : 'visible';
  setProgress(currentIndex / questions.length);
  document.getElementById('progress-label').textContent = 'Вопрос ' + (currentIndex+1) + ' / ' + questions.length;
}

function selectOption(opt){
  history.push({ shape: scores.shape, tight: scores.tight, meta: {...meta}, damage: damageLevel });

  if(opt.terminal === 'straight'){
    isStraight = true;
    showResult();
    return;
  }
  if(opt.shape !== undefined) scores.shape += opt.shape;
  if(opt.tight !== undefined) scores.tight += opt.tight;
  if(opt.texture) meta.texture = opt.texture;
  if(opt.density) meta.density = opt.density;
  if(opt.porosity) meta.porosity = opt.porosity;
  if(opt.damage !== undefined) damageLevel = opt.damage;

  currentIndex++;
  if(currentIndex >= questions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function goBack(){
  if(currentIndex===0) return;
  currentIndex--;
  const prev = history.pop();
  scores.shape = prev.shape;
  scores.tight = prev.tight;
  meta = prev.meta;
  damageLevel = prev.damage;
  renderQuestion();
}

/* ---------------- scoring logic ---------------- */
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

function getGroup(shapeScore){
  const s = clamp(shapeScore, 1, 10);
  if(s<=4) return 2;
  if(s<=7) return 3;
  return 4;
}
function getLetter(tightScore){
  const t = clamp(tightScore, 1, 10);
  if(t<=3) return 'A';
  if(t<=6) return 'B';
  return 'C';
}
function transitionalGroup(shapeScore){
  const s = clamp(shapeScore, 1, 10);
  const g = getGroup(s);
  const gDown = getGroup(s-1);
  const gUp = getGroup(s+1);
  if(gDown!==g) return gDown;
  if(gUp!==g) return gUp;
  return null;
}
function transitionalLetter(tightScore){
  const t = clamp(tightScore, 1, 10);
  const l = getLetter(t);
  const lDown = getLetter(t-1);
  const lUp = getLetter(t+1);
  if(lDown!==l) return lDown;
  if(lUp!==l) return lUp;
  return null;
}

/* ---------------- result rendering ---------------- */
function showResult(){
  document.getElementById('screen-question').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  document.getElementById('card').classList.add('result-mode');
  setProgress(1);
  document.getElementById('progress-label').textContent = 'Результат готов';

  const noteEl = document.getElementById('transitional-note');
  const tipsEl = document.getElementById('result-tips');
  const productsEl = document.getElementById('products');
  const damageBadgeEl = document.getElementById('damage-badge');
  tipsEl.innerHTML = '';
  noteEl.classList.add('hidden');
  productsEl.innerHTML = '';
  damageBadgeEl.textContent = '';
  damageBadgeEl.className = 'damage-badge';

  if(isStraight){
    const c = typeContent.straight;
    document.getElementById('result-badge').textContent = c.badge;
    document.getElementById('result-title').textContent = c.title;
    document.getElementById('result-desc').textContent = c.desc;
    return;
  }

  const group = getGroup(scores.shape);
  const letter = getLetter(scores.tight);
  const type = '' + group + letter;
  const c = typeContent[type];

  document.getElementById('result-badge').textContent = c.badge;
  document.getElementById('result-title').textContent = c.title;
  document.getElementById('result-desc').textContent = c.desc;

  const dmg = damageContent[damageLevel];
  damageBadgeEl.textContent = dmg.label;
  damageBadgeEl.classList.add('dmg-' + damageLevel);

  const altGroup = transitionalGroup(scores.shape);
  const altLetter = transitionalLetter(scores.tight);
  if(altGroup || altLetter){
    const alts = [];
    if(altGroup) alts.push(altGroup + letter);
    if(altLetter) alts.push(group + altLetter);
    noteEl.textContent = 'Похоже, у вас переходный тип — также встречаются черты ' + alts.join(' и ') + '.';
    noteEl.classList.remove('hidden');
  }

  const products = (productByGroup[group] || []).concat(productByType[type] || []).concat(productByDamage[damageLevel] || []);
  if(products.length){
    products.forEach(product=>{
      const a = document.createElement('a');
      a.className = 'product-card';
      a.href = product.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML =
        '<span class="product-img-link"><img class="product-img" src="'+product.img+'" alt="'+product.name+'"></span>' +
        '<span class="product-info">' +
          '<span class="product-eyebrow">'+(product.eyebrow || 'Рекомендуем для вашего типа')+'</span>' +
          '<span class="product-name">'+product.name+'</span>' +
          '<span class="product-price">'+product.price+'</span>' +
          '<span class="product-cta">Смотреть товар →</span>' +
        '</span>';
      productsEl.appendChild(a);
    });
  }

  const tips = [
    { label:'Уход по пористости', text: porosityTip(meta.porosity), cls:'tip-peach' },
    { label:'Общая рекомендация для группы', text: groupCareTip(group), cls:'tip-pink' },
    { label:'Уход при степени повреждения: ' + dmg.label.toLowerCase(), text: dmg.desc + ' ' + dmg.tip, cls:'tip-blue' }
  ];
  tips.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'tip ' + t.cls;
    div.innerHTML = '<span class="tip-label">'+t.label+'</span><span class="tip-text">'+t.text+'</span>';
    tipsEl.appendChild(div);
  });
}

function restartQuiz(){
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('card').classList.remove('result-mode');
  document.getElementById('screen-intro').classList.remove('hidden');
  setProgress(0);
  document.getElementById('progress-label').textContent = 'Тест на тип завитка';
}
